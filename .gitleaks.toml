# gitleaks configuration: the default rules, plus one narrow exception.
title = "Mox"

[extend]
useDefault = true

# Test fixtures and test suites contain obviously fake credentials on
# purpose. Both conditions must hold (AND): the file is test data or a test
# AND the value is one of the known fake ones. A real secret added there
# would still be caught.
[[allowlists]]
description = "Known fake credentials in test data and tests"
condition = "AND"
paths = [
  '''^shared/fixtures/''',
  '''^desktop/macos/Tests/''',
  '''^mobile/android/app/src/test/''',
  '''^web/.*\.test\.js$''',
]
regexes = [
  '''correct-horse-battery-staple-42''',
  '''EXAMPLEKEY''',
  '''\.example\.signature''',
]

# The shortcut generator names Shortcuts' "Get Dictionary Value" action
# (`getvalueforkey`), which the generic-api-key rule mistakes for a key.
# Both the file and the pattern must match.
[[allowlists]]
description = "Shortcuts action name in the shortcut generator"
condition = "AND"
paths = [
  '''^web/app/shortcut/make_shortcut\.py$''',
]
regexTarget = "line"
regexes = [
  '''getvalueforkey''',
]
