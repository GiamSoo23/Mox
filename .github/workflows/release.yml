# Builds signed release binaries. On a version tag (v1.2.3) it publishes a
# GitHub release with them. On a PR that touches this workflow or the
# Android build file, or when run by hand, it's a dry run: build, sign,
# verify, publish nothing. The builds stay as artifacts for a week.
name: Release

on:
  workflow_dispatch:
  push:
    tags: ["v*.*.*"]
  pull_request:
    paths:
      - ".github/workflows/release.yml"
      - "mobile/android/app/build.gradle.kts"
      - "desktop/macos/build-app.sh"

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  version:
    name: Resolve version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - id: v
        run: |
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then version="${GITHUB_REF_NAME#v}"; else version="0.0.1"; fi
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "::error::Tag must be vX.Y.Z, got $GITHUB_REF_NAME"; exit 1; }
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "Version: $version"

  android:
    name: Android APK
    needs: version
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
      - uses: gradle/actions/setup-gradle@v6

      - name: Decode the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          [[ -n "$KEYSTORE_BASE64" ]] || { echo "::error::ANDROID_KEYSTORE_BASE64 secret is missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/mox-release.jks"

      - name: Build the release APK
        env:
          MOX_KEYSTORE_PATH: ${{ runner.temp }}/mox-release.jks
          MOX_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          MOX_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: ./gradlew assembleRelease -PmoxVersion=${{ needs.version.outputs.version }}

      # Refuse to ship an APK that isn't signed with Mox's release key:
      # Android wouldn't accept it as an update to an installed Mox.
      - name: Verify the signature
        env:
          EXPECTED_SHA256: ${{ vars.ANDROID_SIGNING_CERT_SHA256 }}
        run: |
          apksigner="$(ls -d "$ANDROID_HOME"/build-tools/*/ | sort -V | tail -1)apksigner"
          apk=app/build/outputs/apk/release/app-release.apk
          actual=$("$apksigner" verify --print-certs "$apk" | grep -m1 'SHA-256 digest' | sed 's/.*: //')
          echo "Signed by: $actual"
          [[ "$actual" == "$EXPECTED_SHA256" ]] || { echo "::error::APK isn't signed with the release key"; exit 1; }
          cp "$apk" "$GITHUB_WORKSPACE/Mox.apk"

      - name: Remove the decoded key
        if: always()
        run: rm -f "$RUNNER_TEMP/mox-release.jks"

      - uses: actions/upload-artifact@v7
        with:
          name: android
          path: Mox.apk
          retention-days: 7

  macos:
    name: macOS app
    needs: version
    runs-on: macos-15
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/macos
    steps:
      - uses: actions/checkout@v7
      - name: Build Mox.app
        env:
          MOX_OAUTH_CLIENT_SECRET: ${{ secrets.MOX_OAUTH_CLIENT_SECRET }}
        run: |
          # A release without it would only offer the access-token setup.
          if [[ "$GITHUB_REF_TYPE" == "tag" && -z "$MOX_OAUTH_CLIENT_SECRET" ]]; then
            echo "::error::MOX_OAUTH_CLIENT_SECRET secret is missing"; exit 1
          fi
          ./build-app.sh
          if /usr/libexec/PlistBuddy -c "Print :MoxOAuthClientSecret" Mox.app/Contents/Info.plist >/dev/null 2>&1; then
            echo "Sign in with Supabase: enabled"
          else
            echo "Sign in with Supabase: not in this build"
          fi
      - name: Stamp the version and zip
        env:
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          plist=Mox.app/Contents/Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" "$plist"
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" "$plist"
          codesign --force --deep --sign - Mox.app
          [[ ! -e Mox.app/Contents/Resources/.env ]] || { echo "::error::A .env ended up in the bundle"; exit 1; }
          ditto -c -k --keepParent Mox.app "$GITHUB_WORKSPACE/Mox-macOS.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: macos
          path: Mox-macOS.zip
          retention-days: 7

  publish:
    name: Publish the GitHub release
    if: github.ref_type == 'tag'
    needs: [version, android, macos]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          path: dist
          merge-multiple: true
      - name: Checksums
        working-directory: dist
        run: sha256sum Mox.apk Mox-macOS.zip > SHA256SUMS.txt && cat SHA256SUMS.txt
      - name: Create the release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          # Always mark it latest: the pairing page links to
          # releases/latest/download/Mox.apk, and GitHub's "latest" skips
          # pre-releases. A 0.x version already says it's early.
          flags=(--title "Mox $VERSION" --generate-notes --verify-tag --latest)
          gh release create "$GITHUB_REF_NAME" dist/Mox.apk dist/Mox-macOS.zip dist/SHA256SUMS.txt "${flags[@]}"
