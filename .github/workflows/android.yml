# Lints, unit-tests and builds the Android app on every PR that touches it, and keeps
# the debug APK as a downloadable artifact for testing on a phone.
name: Android

on:
  pull_request:
    paths:
      - "mobile/android/**"
      - "shared/**"
      - ".editorconfig"
      - ".github/workflows/android.yml"
  push:
    branches: [main]
    paths:
      - "mobile/android/**"
      - "shared/**"
      - ".editorconfig"
      - ".github/workflows/android.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Lint and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: mobile/android
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      # Caches Gradle dependencies and the build cache between runs.
      - uses: gradle/actions/setup-gradle@v6

      - name: Lint
        run: ./gradlew ktlintCheck

      - name: Unit tests
        run: ./gradlew testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v7
        with:
          name: mox-debug-apk
          path: mobile/android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 7
