# Starts a throwaway Supabase stack in Docker, applies every migration,
# runs the pgTAP database tests and checks the shared fixtures. Never touches a real Supabase project.
name: Backend

on:
  pull_request:
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/backend.yml"
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "shared/**"
      - ".github/workflows/backend.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  test:
    name: Database tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7

      - uses: supabase/setup-cli@v3
        with:
          version: 3.0.0

      # Only Postgres and what the schema needs (Storage creates the
      # storage.buckets table). Applies all migrations on start.
      - name: Start Supabase
        run: >
          supabase start
          -x studio,imgproxy,edge-runtime,logflare,vector,realtime,mailpit,supavisor,postgres-meta

      - name: Run pgTAP tests
        run: supabase test db

      # Every shared fixture must agree with the schema: valid rows are
      # accepted, invalid rows are rejected.
      - name: Check shared fixtures against the schema
        run: ../shared/fixtures/check-rows.sh

  function:
    name: Edge Function tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: backend/supabase/functions
    steps:
      - uses: actions/checkout@v7
      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - run: deno fmt --check --line-width 120 .
      - run: deno check */index.ts
      - run: deno test
