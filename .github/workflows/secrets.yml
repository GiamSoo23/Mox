# Scans the whole git history for committed secrets (API keys, tokens…) on
# every PR and push to main. Reviewed, harmless findings live in
# .gitleaksignore with a comment explaining why.
name: Secrets

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1

jobs:
  gitleaks:
    name: Secret scan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # full history, not just the last commit

      - name: Install gitleaks (checksum-verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          file="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSLO "$base/$file"
          curl -sSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $file\$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          tar -xzf "$file" gitleaks

      - name: Scan full history
        run: ./gitleaks git --log-opts="--all" --redact --no-banner -v .

      # The Mox OAuth app's secret goes only into official Mac builds (#82).
      # Look for its exact value anywhere in the history, without printing it.
      # Skipped where the secret isn't available (PRs from forks).
      - name: The OAuth client secret was never committed
        env:
          OAUTH_SECRET: ${{ secrets.MOX_OAUTH_CLIENT_SECRET }}
        run: |
          if [[ -z "$OAUTH_SECRET" ]]; then echo "Secret not available here; skipped."; exit 0; fi
          if git log --all -p --no-color | grep -qF -- "$OAUTH_SECRET"; then
            echo "::error::The OAuth client secret appears in the git history. Rotate it in Supabase."
            exit 1
          fi
          echo "Not in the history."
