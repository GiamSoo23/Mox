# Tests the pairing page against the shared fixtures, and deploys web/ to
# GitHub Pages on every push to main.
name: Web

on:
  pull_request:
    paths:
      - "web/**"
      - "shared/fixtures/pairing/**"
      - ".github/workflows/web.yml"
  push:
    branches: [main]
    paths:
      - "web/**"
      - "shared/fixtures/pairing/**"
      - ".github/workflows/web.yml"

permissions:
  contents: read

jobs:
  test:
    name: Pairing page tests
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Test the link parser against the shared fixtures
        run: npm test

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name == 'push'
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    # Never cancel a deployment halfway through.
    concurrency:
      group: pages
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v5
