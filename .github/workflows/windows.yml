# Builds the Windows app and runs its tests against the shared fixtures, on
# a real Windows runner.
name: Windows

on:
  pull_request:
    paths:
      - "desktop/windows/**"
      - "shared/fixtures/**"
      - "backend/supabase/migrations/**"
      - "backend/supabase/functions/**"
      - ".github/workflows/windows.yml"
  push:
    branches: [main]
    paths:
      - "desktop/windows/**"
      - "shared/fixtures/**"
      - "backend/supabase/migrations/**"
      - "backend/supabase/functions/**"
      - ".github/workflows/windows.yml"

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: desktop/windows
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 8.0.x
      - name: Test Mox.Core against the shared fixtures
        run: dotnet test tests/Mox.Core.Tests --nologo
      - name: Build the tray app
        run: dotnet build src/Mox.Tray -c Release --nologo
      # A single Mox.exe that needs nothing installed, for Intel/AMD PCs and
      # for ARM (including Windows on a Mac in a virtual machine).
      - name: Publish Mox.exe
        shell: pwsh
        run: |
          foreach ($rid in "win-x64", "win-arm64") {
            dotnet publish src/Mox.Tray -c Release -r $rid --self-contained true `
              -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o "out/$rid" --nologo
          }
      - uses: actions/upload-artifact@v7
        with:
          name: mox-windows-x64
          path: desktop/windows/out/win-x64/Mox.exe
          retention-days: 7
      - uses: actions/upload-artifact@v7
        with:
          name: mox-windows-arm64
          path: desktop/windows/out/win-arm64/Mox.exe
          retention-days: 7
